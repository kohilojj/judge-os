<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JUDGE_OS_v40_MOBILE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --neon: #00f0ff; --ai: #bc13fe; --danger: #ff003c;
            --success: #2db300; --bg: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* MOBILE HEADER */
        header {
            padding: 15px; border-bottom: 1px solid rgba(188, 19, 254, 0.3);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }
        .logo { font-weight: 900; letter-spacing: 2px; color: var(--neon); font-size: 18px; }

        /* MAIN CONTENT - SCROLLABLE */
        main {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* THE CAMERA BOX - OPTIMIZED FOR TOUCH */
        .scan-trigger {
            width: 100%; min-height: 250px; background: #000;
            border: 2px dashed #222; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .scan-trigger:active { border-color: var(--neon); background: rgba(0,240,255,0.05); }

        #preview-img { width: 100%; height: 100%; object-fit: contain; display: none; }
        
        /* 70-TOOL MOBILE GRID */
        .status-bar {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        }
        .stat-card { background: #111; padding: 12px; border-radius: 8px; border: 1px solid #1a1a1a; text-align: center; }
        .stat-label { font-size: 9px; color: #555; text-transform: uppercase; }
        .stat-val { font-size: 14px; color: var(--neon); font-weight: bold; }

        /* AI FEEDBACK AREA */
        .feedback-box {
            background: #000; border: 1px solid var(--ai); border-radius: 10px;
            padding: 20px; min-height: 120px; box-shadow: 0 0 20px rgba(188,19,254,0.1);
        }
        .feedback-text { font-size: 14px; line-height: 1.6; color: #ccc; }

        /* FLOATING TASK LIST BUTTON */
        #task-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 60px; height: 60px; background: var(--ai);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--ai); font-size: 24px; z-index: 100;
        }

        /* HIDDEN FILE INPUT WITH CAPTURE */
        #cam-input { display: none; }

        .scan-line {
            position: absolute; width: 100%; height: 3px; background: var(--neon);
            top: 0; box-shadow: 0 0 15px var(--neon); animation: scan 3s linear infinite; display: none;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>
<body>

<header>
    <div class="logo">JUDGE_OS v40</div>
    <div id="g_id_onload"
         data-client_id="213389113664-s65htka59riaq23iin8shl330v4ai370.apps.googleusercontent.com"
         data-callback="onSignIn">
    </div>
    <div class="g_id_signin" data-type="icon" data-shape="circle"></div>
</header>

<main>
    <div class="status-bar">
        <div class="stat-card"><div class="stat-label">AI_MODE</div><div class="stat-val">SOCRATIC</div></div>
        <div class="stat-card"><div class="stat-label">LINK_STATUS</div><div id="link-status" class="stat-val" style="color:var(--danger)">OFFLINE</div></div>
    </div>

    <div class="scan-trigger" onclick="document.getElementById('cam-input').click()">
        <div class="scan-line" id="line"></div>
        <div id="cam-icon" style="font-size: 50px; color: #1a1a1a;">📸</div>
        <div id="tap-text" style="font-size: 10px; color: #444; margin-top: 10px;">KOSKETA AVATAKSESI KAMERA</div>
        <img id="preview-img">
        <input type="file" id="cam-input" accept="image/*" capture="environment" onchange="handleCapture(event)">
    </div>

    <div class="feedback-box">
        <div style="font-size: 9px; color: var(--ai); margin-bottom: 10px;">ANALYSIS_LOG:</div>
        <div id="ai-out" class="feedback-text">Odotetaan visuaalista dataa tehtävästä...</div>
    </div>
</main>

<div id="task-btn" onclick="alert('Tehtävälista tulossa mobiilivalikkoon!')">📝</div>

<script>
// --- FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAsCBiakmw92y60t4Z5PETtyuToY4EOnTA",
    authDomain: "developme-1a747.firebaseapp.com",
    databaseURL: "https://developme-1a747-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "developme-1a747",
    appId: "1:467417750458:web:f1ae85b3f27dc85114db83"
};
firebase.initializeApp(firebaseConfig);

// --- MOBILE CAMERA HANDLER ---
function handleCapture(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    document.getElementById('cam-icon').style.display = 'none';
    document.getElementById('tap-text').style.display = 'none';
    document.getElementById('line').style.display = 'block';
    
    const preview = document.getElementById('preview-img');

    reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
        processAI();
    };
    reader.readAsDataURL(file);
}

function processAI() {
    const out = document.getElementById('ai-out');
    out.innerHTML = "<span style='color:var(--neon)'>SKANNATAAN...</span><br>Luetaan käsialaa ja analysoidaan logiikkaa...";

    setTimeout(() => {
        out.innerHTML = `
            <b style="color:var(--ai)">SENTINEL:</b> Näen tehtäväsi. <br><br>
            Olet ratkaissut x:n arvon, mutta huomasitko, että tehtävässä pyydettiin vastausta metreinä, ei senttimetreinä? <br><br>
            <i>Vinkki: Jaa tuloksesi sadalla.</i>
        `;
        document.getElementById('line').style.display = 'none';
    }, 3000);
}

function onSignIn(res) {
    document.getElementById('link-status').innerText = "ONLINE";
    document.getElementById('link-status').style.color = "var(--success)";
}
</script>
</body>
</html>
