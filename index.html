<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORMA RUN: TEACHER ATTACK</title>
    <style>
        :root { --jorma: #ff3333; --ope: #444; --bg: #222; --floor: #8d6e63; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }

        #game-container {
            position: relative; width: 800px; height: 400px;
            background: linear-gradient(to bottom, #1a1a1a, #333);
            border: 4px solid #fff; overflow: hidden;
        }

        /* JORMA */
        #jorma {
            position: absolute; width: 40px; height: 60px;
            background: var(--jorma); border: 3px solid #000;
            border-radius: 5px; z-index: 10;
        }
        #jorma::after { /* Jorman lippis */
            content: ""; position: absolute; top: 0; right: -5px;
            width: 15px; height: 8px; background: #000;
        }

        /* VIHOLLISET (OPETTAJAT) */
        .teacher {
            position: absolute; width: 40px; height: 65px;
            background: var(--ope); border: 2px solid #fff;
            z-index: 5; transition: transform 0.1s;
        }
        .teacher::before { /* Opettajan lasit */
            content: "👓"; position: absolute; top: 10px; left: 5px; font-size: 20px;
        }

        /* KERÄTTÄVÄT (KOEPAPERIT) */
        .paper {
            position: absolute; width: 25px; height: 30px;
            background: #fff; border: 1px solid #ccc;
            display: flex; align-items: center; justify-content: center;
            color: red; font-weight: bold; font-size: 12px;
        }

        /* HUD */
        #hud {
            position: absolute; top: 10px; left: 10px; color: #fff;
            font-size: 20px; z-index: 100; text-shadow: 2px 2px #000;
        }
        
        #floor {
            position: absolute; bottom: 0; width: 2000px; height: 40px;
            background: var(--floor); border-top: 4px solid #5d4037;
        }

        #msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; display: none; z-index: 1000; background: rgba(0,0,0,0.8);
            padding: 20px; border: 2px solid red;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">JORMA: <span id="score">0</span> | VÄLTÄ OPETTAJIA!</div>
        <div id="jorma"></div>
        <div id="floor"></div>
        <div id="msg">
            <h1 style="color: red;">OPETTAJA SAI KIINNI!</h1>
            <p style="color: white;">Jorma joutui jälki-istuntoon.</p>
            <button onclick="location.reload()" style="margin-top:20px; padding: 10px; cursor:pointer;">Yritä uudelleen</button>
        </div>
    </div>

<script>
    const jorma = document.getElementById('jorma');
    const container = document.getElementById('game-container');
    const scoreEl = document.getElementById('score');
    const msg = document.getElementById('msg');
    const floor = document.getElementById('floor');

    // Pelin tila
    let score = 0;
    let gameActive = true;
    let jormaPos = { x: 50, y: 300, vx: 0, vy: 0 };
    let keys = {};
    let teachers = [];
    let papers = [];

    // Vakioarvot
    const gravity = 0.8;
    const jumpPower = -15;
    const speed = 5;

    // Kontrollit
    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;

    // Luodaan opettajia
    function spawnTeacher() {
        if(!gameActive) return;
        const t = document.createElement('div');
        t.className = 'teacher';
        let x = 800 + Math.random() * 400;
        t.style.left = x + 'px';
        t.style.bottom = '40px';
        container.appendChild(t);
        teachers.push({ el: t, x: x, speed: 3 + Math.random() * 3 });
        setTimeout(spawnTeacher, 2000 + Math.random() * 2000);
    }

    // Luodaan koepapereita
    function spawnPaper() {
        if(!gameActive) return;
        const p = document.createElement('div');
        p.className = 'paper';
        p.innerHTML = "A+";
        let x = 800;
        let y = 150 + Math.random() * 150;
        p.style.left = x + 'px';
        p.style.bottom = y + 'px';
        container.appendChild(p);
        papers.push({ el: p, x: x, y: y });
        setTimeout(spawnPaper, 1500);
    }

    function update() {
        if (!gameActive) return;

        // Jorman liike
        if (keys['ArrowLeft']) jormaPos.vx = -speed;
        else if (keys['ArrowRight']) jormaPos.vx = speed;
        else jormaPos.vx = 0;

        if (keys['Space'] && jormaPos.y === 300) {
            jormaPos.vy = jumpPower;
        }

        // Fysiikka
        jormaPos.vy += gravity;
        jormaPos.y += jormaPos.vy;
        jormaPos.x += jormaPos.vx;

        // Lattiatörmäys
        if (jormaPos.y > 300) {
            jormaPos.y = 300;
            jormaPos.vy = 0;
        }
        // Seinätörmäys
        if (jormaPos.x < 0) jormaPos.x = 0;
        if (jormaPos.x > 760) jormaPos.x = 760;

        jorma.style.left = jormaPos.x + 'px';
        jorma.style.top = jormaPos.y + 'px';

        // Opettajien päivitys
        teachers.forEach((t, i) => {
            t.x -= t.speed;
            t.el.style.left = t.x + 'px';

            // Törmäys Jormaan
            let jr = jorma.getBoundingClientRect();
            let tr = t.el.getBoundingClientRect();

            if (jr.right > tr.left && jr.left < tr.right && jr.bottom > tr.top) {
                // Jos Jorma hyppää opettajan päälle (Mario-tyyli)
                if (jormaPos.vy > 0 && jr.bottom < tr.top + 20) {
                    t.el.remove();
                    teachers.splice(i, 1);
                    jormaPos.vy = -10; // Kimpoaa ylös
                    score += 50;
                    scoreEl.innerText = score;
                } else {
                    gameActive = false;
                    msg.style.display = 'block';
                }
            }

            if (t.x < -50) {
                t.el.remove();
                teachers.splice(i, 1);
            }
        });

        // Papereiden päivitys
        papers.forEach((p, i) => {
            p.x -= 4;
            p.el.style.left = p.x + 'px';

            let jr = jorma.getBoundingClientRect();
            let pr = p.el.getBoundingClientRect();

            if (jr.right > pr.left && jr.left < pr.right && jr.bottom > pr.top && jr.top < pr.bottom) {
                p.el.remove();
                papers.splice(i, 1);
                score += 10;
                scoreEl.innerText = score;
            }

            if (p.x < -50) {
                p.el.remove();
                papers.splice(i, 1);
            }
        });

        requestAnimationFrame(update);
    }

    spawnTeacher();
    spawnPaper();
    update();
</script>
</body>
</html>
