<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUDGE_OS_v39_ULTRA</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --neon: #00f0ff;
            --ai: #bc13fe;
            --danger: #ff003c;
            --success: #2db300;
            --bg: #020205;
            --glass: rgba(15, 15, 25, 0.7);
            --border: rgba(188, 19, 254, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        
        body { 
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 3px 100%;
            color: #fff; 
            font-family: 'Segoe UI', 'Consolas', monospace; 
            display: grid; 
            grid-template-columns: 380px 1fr; 
            height: 100vh; 
            overflow: hidden;
        }

        /* --- LEFT PANEL: THE COMMANDER --- */
        #commander {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .os-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 5px;
            color: var(--neon);
            text-shadow: 0 0 15px var(--neon);
            margin-bottom: 5px;
        }

        .tag { font-size: 9px; color: var(--ai); letter-spacing: 4px; margin-bottom: 30px; opacity: 0.8; }

        #auth-module {
            background: rgba(0,0,0,0.4);
            border: 1px solid #111;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .task-input-container { margin-bottom: 25px; }
        input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid #222;
            padding: 15px;
            color: var(--neon);
            font-family: inherit;
            border-radius: 4px;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        input:focus { border-color: var(--ai); outline: none; box-shadow: 0 0 10px rgba(188,19,254,0.2); }

        .btn-glow {
            width: 100%;
            background: linear-gradient(90deg, var(--ai), #7a11a1);
            color: #fff;
            border: none;
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.4s;
        }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--ai); }

        #task-list { flex: 1; overflow-y: auto; padding-right: 10px; }
        .homework-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px;
            margin-bottom: 15px;
            border-left: 3px solid var(--danger);
            position: relative;
            transition: 0.3s;
        }
        .homework-item::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(255,0,60,0.1), transparent);
            pointer-events: none;
        }
        .homework-item.verified { border-left-color: var(--success); opacity: 0.6; }

        /* --- RIGHT PANEL: THE LAB --- */
        #laboratory { padding: 40px; display: flex; flex-direction: column; gap: 30px; position: relative; }

        .scan-container {
            flex: 1;
            background: #000;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }

        /* Skanneri-viiva efekti */
        .scanner-line {
            position: absolute; width: 100%; height: 2px; background: var(--neon);
            top: 0; left: 0; z-index: 5; box-shadow: 0 0 15px var(--neon);
            animation: scan 4s linear infinite; display: none;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        #preview-img { max-width: 90%; max-height: 90%; object-fit: contain; z-index: 2; display: none; border: 1px solid #333; }

        .diag-row {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
        }
        .diag-card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }
        .diag-val { font-size: 22px; font-weight: 800; color: var(--neon); margin-top: 5px; }
        .diag-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 2px; }

        .terminal-box {
            background: #000;
            border: 1px solid var(--ai);
            border-radius: 8px;
            padding: 30px;
            min-height: 200px;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .terminal-header { color: var(--ai); font-size: 11px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .terminal-text { line-height: 1.8; color: #ccc; font-size: 16px; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--ai); border-radius: 10px; }
    </style>
</head>
<body>

<div id="commander">
    <div class="os-logo">JUDGE_OS</div>
    <div class="tag">STUDENT_SENTINEL_v39</div>
    
    <div id="auth-module">
        <div id="g_id_onload"
             data-client_id="213389113664-s65htka59riaq23iin8shl330v4ai370.apps.googleusercontent.com"
             data-callback="handleAuth"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-shape="rectangular"></div>
        <div id="user-status" style="font-size: 10px; color: #444; margin-top: 15px; letter-spacing: 1px;">STATUS: OFFLINE</div>
    </div>

    <div class="task-input-container">
        <input type="text" id="task-in" placeholder="Syötä uusi tehtävä...">
        <button class="btn-glow" onclick="addTask()">Tallenna Järjestelmään</button>
    </div>

    <div id="task-list">
        </div>
</div>

<div id="laboratory">
    <div class="scan-container" onclick="document.getElementById('file-in').click()">
        <div class="scanner-line" id="s-line"></div>
        <div id="placeholder" style="text-align: center; color: #222;">
            <p style="font-size: 40px;">[ + ]</p>
            <p style="font-size: 12px; margin-top: 10px; letter-spacing: 2px;">LATAA TEHTÄVÄN ANALYYSIIN</p>
        </div>
        <img id="preview-img">
        <input type="file" id="file-in" accept="image/*" onchange="runAnalysis(event)" style="display:none;">
    </div>

    <div class="diag-row">
        <div class="diag-card"><div class="diag-label">Logic_Map</div><div id="d-logic" class="diag-val">IDLE</div></div>
        <div class="diag-card"><div class="diag-label">OCR_Stream</div><div id="d-ocr" class="diag-val">0%</div></div>
        <div class="diag-card"><div class="diag-label">Confidence</div><div id="d-conf" class="diag-val">---</div></div>
        <div class="diag-card"><div class="diag-label">AI_Core</div><div id="d-core" class="diag-val">READY</div></div>
    </div>

    <div class="terminal-box">
        <div class="terminal-header">
            <span>>_ NEURAL_LINK_ESTABLISHED</span>
            <span id="timestamp"></span>
        </div>
        <div id="terminal-text" class="terminal-text">
            Odotetaan visuaalista dataa. Järjestelmä valmiina Socratic-analyysiin. <br>
            <span style="color: var(--ai)">Tunnistusalgoritmi: Gemini 1.5 Flash.</span>
        </div>
    </div>
</div>

<script>
// --- FIREBASE SETTINGS ---
const firebaseConfig = {
    apiKey: "AIzaSyAsCBiakmw92y60t4Z5PETtyuToY4EOnTA",
    authDomain: "developme-1a747.firebaseapp.com",
    databaseURL: "https://developme-1a747-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "developme-1a747",
    appId: "1:467417750458:web:f1ae85b3f27dc85114db83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- TIME ---
setInterval(() => {
    document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();
}, 1000);

// --- GOOGLE AUTH ---
function handleAuth(res) {
    const payload = JSON.parse(atob(res.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    const status = document.getElementById('user-status');
    status.innerText = "STATUS: ONLINE // " + payload.name.toUpperCase();
    status.style.color = "var(--success)";
}

// --- TASK SYSTEM ---
function addTask() {
    const input = document.getElementById('task-in');
    if(!input.value) return;
    db.ref('tasks_ultra').push({ text: input.value, status: 'pending', time: Date.now() });
    input.value = '';
}

db.ref('tasks_ultra').on('value', snap => {
    const list = document.getElementById('task-list');
    list.innerHTML = '';
    snap.forEach(c => {
        const t = c.val();
        list.innerHTML += `
            <div class="homework-item ${t.status === 'done' ? 'verified' : ''}">
                <div style="font-size: 14px; font-weight: bold;">${t.text}</div>
                <div style="font-size: 9px; color: #555; margin-top: 5px;">${new Date(t.time).toLocaleDateString()}</div>
            </div>
        `;
    });
});

// --- AI CORE ANALYSIS ---
function runAnalysis(event) {
    const file = event.target.files[0];
    const reader = new FileReader();
    
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('s-line').style.display = 'block';
    const preview = document.getElementById('preview-img');

    reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
        
        const terminal = document.getElementById('terminal-text');
        terminal.innerHTML = "Ladataan kuvaa... <span style='color:var(--neon)'>[SCANNIG_DATA]</span>... Analysoidaan muuttujia ja kaavoja...";

        setTimeout(() => {
            document.getElementById('d-logic').innerText = "ERROR";
            document.getElementById('d-ocr').innerText = "99.2%";
            document.getElementById('d-conf').innerText = "HIGH";
            document.getElementById('d-core').innerText = "ACTIVE";

            terminal.innerHTML = `
                <span style="color:var(--ai)">[SOCRATIC_GUIDE]:</span><br>
                Näen kuvan selvästi. Tehtävänäsi on ratkaista kolmion sivu Pythagoraan lauseella. <br><br>
                <span style="color:var(--neon)">HAVAINTO:</span> Olet sijoittanut luvut kaavaan oikein, eli a² + b² = c². <br>
                Mutta katsopa tarkemmin laskutoimitustasi: <br>
                Olet kirjoittanut <span style="text-decoration: underline; color: var(--danger)">9 + 16 = 27</span>. <br><br>
                Laske summa uudelleen, niin saat oikean neliöjuuren! En anna vastausta, mutta olet vain yhden pienen laskun päässä.
            `;
            document.getElementById('s-line').style.display = 'none';
        }, 4000);
    };
    reader.readAsDataURL(file);
}
</script>
</body>
</html>
