<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTTLE_FLIP_v44_PRO</title>
    <style>
        :root {
            --neon: #00f0ff;
            --ai: #bc13fe;
            --bg: #0a0a0f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            font-family: 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; color: white;
        }

        #game-stage {
            position: relative;
            width: 100vw; height: 100vh;
            max-width: 600px; max-height: 800px;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
            border: 2px solid var(--ai);
            box-shadow: 0 0 50px rgba(188, 19, 254, 0.2);
        }

        /* PULLO */
        #bottle {
            position: absolute;
            width: 30px; height: 70px;
            background: rgba(0, 240, 255, 0.3);
            border: 2px solid var(--neon);
            border-radius: 5px 5px 2px 2px;
            z-index: 10;
            transform-origin: center bottom;
        }
        #bottle::before { /* Korkki */
            content: ""; position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%); width: 12px; height: 10px;
            background: #fff; border-radius: 2px;
        }

        /* TASOT (PÖYDÄT) */
        .platform {
            position: absolute;
            background: linear-gradient(180deg, #333 0%, #111 100%);
            border-top: 4px solid var(--ai);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* HUD */
        #hud {
            position: absolute; top: 30px; left: 0; width: 100%;
            text-align: center; z-index: 100;
        }
        .score { font-size: 40px; font-weight: 900; color: var(--neon); text-shadow: 0 0 15px var(--neon); }
        .power-bar-bg {
            width: 200px; height: 10px; background: #222; margin: 10px auto;
            border-radius: 5px; overflow: hidden;
        }
        #power-fill { width: 0%; height: 100%; background: var(--ai); transition: 0.1s; }

        #msg {
            position: absolute; top: 40%; width: 100%; text-align: center;
            display: none; z-index: 200;
        }
        button {
            background: var(--neon); color: #000; border: none; padding: 15px 40px;
            font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 50px;
        }
    </style>
</head>
<body>

    <div id="game-stage">
        <div id="hud">
            <div class="score" id="score-val">0</div>
            <div class="power-bar-bg"><div id="power-fill"></div></div>
            <div style="font-size: 10px; letter-spacing: 2px; color: #444;">PAINA PITKÄÄN LADATAKSESI</div>
        </div>

        <div id="bottle"></div>

        <div id="msg">
            <h1 style="font-size: 50px; color: var(--ai); margin-bottom: 20px;">FLIP FAILED</h1>
            <button onclick="location.reload()">TRY AGAIN</button>
        </div>
    </div>

<script>
    const bottle = document.getElementById('bottle');
    const powerFill = document.getElementById('power-fill');
    const scoreVal = document.getElementById('score-val');
    const msg = document.getElementById('msg');
    const stage = document.getElementById('game-stage');

    let score = 0;
    let power = 0;
    let isCharging = false;
    let isFlipping = false;
    
    // Fysiikka-arvot
    let bx = 50; let by = 0; // Pullon sijainti suhteessa tasoon
    let rotation = 0;
    let vx = 0; let vy = 0;
    let vr = 0; // Pyörimisnopeus
    const gravity = 0.25;

    // Tasojen hallinta
    let currentPlatform = { x: 30, y: 500, w: 100 };
    let nextPlatform = { x: 250, y: 450, w: 80 };

    function createPlatform(p, isCurrent) {
        const div = document.createElement('div');
        div.className = 'platform';
        div.style.left = p.x + 'px';
        div.style.top = p.y + 'px';
        div.style.width = p.w + 'px';
        div.style.height = '300px';
        if(!isCurrent) div.id = 'next-p';
        stage.appendChild(div);
    }

    function init() {
        createPlatform(currentPlatform, true);
        createPlatform(nextPlatform, false);
        resetBottle();
    }

    function resetBottle() {
        isFlipping = false;
        power = 0;
        powerFill.style.width = '0%';
        bx = currentPlatform.x + (currentPlatform.w / 2) - 15;
        by = stage.offsetHeight - currentPlatform.y;
        rotation = 0;
        bottle.style.left = bx + 'px';
        bottle.style.bottom = by + 'px';
        bottle.style.transform = `rotate(0deg)`;
    }

    // LATAUS JA HYPPY
    window.onmousedown = window.ontouchstart = () => {
        if (!isFlipping) isCharging = true;
    };

    window.onmouseup = window.ontouchend = () => {
        if (isCharging) {
            isCharging = false;
            flip();
        }
    };

    function flip() {
        isFlipping = true;
        vx = power * 0.15;
        vy = power * 0.45;
        vr = power * 0.8; // Pyöriminen voiman mukaan
    }

    function update() {
        if (isCharging) {
            power = Math.min(power + 2, 100);
            powerFill.style.width = power + '%';
            bottle.style.transform = `scaleY(${1 - (power/400)})`; // Puristus-efekti
        }

        if (isFlipping) {
            vy -= gravity;
            bx += vx;
            by += vy;
            rotation += vr;

            bottle.style.left = bx + 'px';
            bottle.style.bottom = by + 'px';
            bottle.style.transform = `rotate(${rotation}deg)`;

            // TÖRMÄYS TARKISTUS
            if (vy < 0) { // Vain kun pullo putoaa
                let bottleBottom = stage.offsetHeight - by;
                let landingX = bx + 15;

                // Tarkistetaan osuuko tasoon
                let p = (landingX > nextPlatform.x && landingX < nextPlatform.x + nextPlatform.w) ? nextPlatform : 
                        (landingX > currentPlatform.x && landingX < currentPlatform.x + currentPlatform.w) ? currentPlatform : null;

                if (p && bottleBottom >= p.y && bottleBottom <= p.y + 20) {
                    checkLanding(p);
                }
            }

            // Pelialueelta putoaminen
            if (by < -100 || bx > stage.offsetWidth) {
                gameOver();
            }
        }
        requestAnimationFrame(update);
    }

    function checkLanding(p) {
        // Tarkistetaan onko pullo suorassa (n. 360 asteen monikerrat)
        let normalizedRotation = Math.abs(rotation % 360);
        if (normalizedRotation < 15 || normalizedRotation > 345) {
            if (p === nextPlatform) {
                success();
            } else {
                // Laskeuduttiin takaisin samalle pöydälle
                isFlipping = false;
                rotation = 0;
                by = stage.offsetHeight - p.y;
                bottle.style.bottom = by + 'px';
                bottle.style.transform = `rotate(0deg)`;
            }
        } else {
            gameOver();
        }
    }

    function success() {
        score++;
        scoreVal.innerText = score;
        
        // Siirretään tasot
        const oldP = document.getElementById('next-p');
        if(oldP) oldP.remove();
        
        currentPlatform = nextPlatform;
        nextPlatform = {
            x: Math.random() * (stage.offsetWidth - 100) + 50,
            y: 400 + (Math.random() * 100),
            w: Math.max(60, 100 - (score * 2)) // Tasot pienenevät
        };
        
        document.querySelectorAll('.platform')[0].remove();
        createPlatform(currentPlatform, true);
        createPlatform(nextPlatform, false);
        
        resetBottle();
    }

    function gameOver() {
        gameActive = false;
        msg.style.display = 'block';
    }

    init();
    update();
</script>
</body>
</html>
