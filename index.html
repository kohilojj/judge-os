<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUDGE_OS_v32_OMEGA</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --neon: #00f0ff; --ai: #bc13fe; --vr: #2db300; --danger: #ff003c;
            --warn: #ffcc00; --bg: #000; --panel: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Consolas', monospace; overflow: hidden; }

        /* --- TACTICAL TOP-DOWN MAP --- */
        #map { position: absolute; top: 0; bottom: 380px; width: 100%; contain: strict; }

        /* --- CONTROL CENTER --- */
        #dashboard {
            position: absolute; bottom: 0; width: 100%; height: 380px;
            background: var(--panel); border-top: 2px solid var(--ai);
            display: grid; grid-template-columns: 380px 1fr 400px;
            z-index: 100; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .sector { padding: 20px; border-right: 1px solid #111; display: flex; flex-direction: column; overflow: hidden; }
        .tag { font-size: 10px; color: #444; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }

        /* --- CARDS & DATA --- */
        .card { background: rgba(255,255,255,0.02); border: 1px solid #111; padding: 15px; border-radius: 4px; margin-bottom: 10px; }
        .val-main { font-size: 34px; font-weight: bold; color: var(--neon); line-height: 1; }
        .val-sub { font-size: 12px; margin-top: 5px; color: #888; }
        
        .alert-box { color: var(--danger); font-weight: bold; font-size: 11px; margin-top: 10px; min-height: 15px; }
        .blink { animation: blinker 0.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* --- MINIMALIST MARKERS (NO LAG) --- */
        .m-ptr { width: 12px; height: 12px; border: 1px solid #fff; will-change: transform; cursor: pointer; }
        .m-bus { background: var(--neon); border-radius: 50%; }
        .m-train { background: var(--vr); transform: rotate(45deg); }
        .m-tram { background: var(--warn); border-radius: 2px; }

        #log-stream { font-size: 10px; color: #333; height: 260px; overflow-y: hidden; line-height: 1.4; }
        .log-line b { color: var(--ai); }
    </style>
</head>
<body>

<div id="map"></div>

<div id="dashboard">
    <div class="sector">
        <div class="tag">AI_TARGETING_CORE</div>
        <div class="card">
            <div id="u-id" style="font-size: 11px; color: #555; margin-bottom: 5px;">AWAITING_SELECTION</div>
            <div id="u-line" class="val-main">---</div>
            <div id="u-type" class="val-sub">READY TO SCAN</div>
        </div>
        <div class="card">
            <div id="u-delay" style="font-size: 20px; font-weight: bold;">DELAY: 0s</div>
            <div id="u-stop" class="val-sub">STOP: EN_ROUTE</div>
        </div>
        <div id="u-spd" style="font-size: 10px; color: #333;">VELOCITY: 0.0 km/h</div>
    </div>

    <div class="sector">
        <div class="tag">DRIVER_CONDUCT_G_ANALYSIS</div>
        <canvas id="kineticChart"></canvas>
        <div id="driver-status" class="alert-box"></div>
    </div>

    <div class="sector">
        <div class="tag">SENTINEL_CLOUD_PERSISTENCE</div>
        <div id="log-stream">
            <div class="log-line">Handshake with <b>developme-1a747</b>...</div>
        </div>
    </div>
</div>

<script>
// --- CORE CONFIG ---
const firebaseConfig = {
    apiKey: "AIzaSyAsCBiakmw92y60t4Z5PETtyuToY4EOnTA",
    authDomain: "developme-1a747.firebaseapp.com",
    databaseURL: "https://developme-1a747-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "developme-1a747",
    appId: "1:467417750458:web:f1ae85b3f27dc85114db83"
};

// --- START ENGINES ---
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const state = { 
    units: new Map(), markers: new Map(), selected: null, 
    chart: null, gBuf: Array(60).fill(0) 
};

// --- MAP OPTIMIZATION (LAG-FREE) ---
const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [24.94, 60.17], zoom: 13, pitch: 0, bearing: 0,
    fadeDuration: 0, trackResize: false
});

// --- REAL-TIME DATA (MQTT) ---
const client = mqtt.connect('wss://mqtt.hsl.fi:443/');
client.on('connect', () => {
    client.subscribe('/hfp/v2/journey/ongoing/vp/+/+/+/+/+/+/+/+/+/+/+/+/+/#');
});

client.on('message', (topic, msg) => {
    const d = JSON.parse(msg).VP;
    if (!d?.veh) return;

    // Unit Creation
    if (!state.units.has(d.veh)) {
        const type = topic.includes('train') ? 'train' : (topic.includes('tram') ? 'tram' : 'bus');
        const el = document.createElement('div');
        el.className = `m-ptr m-${type}`;
        el.onclick = () => { 
            state.selected = d.veh; 
            if(!state.chart) initChart();
            document.getElementById('u-id').innerText = `UNIT_ID: ${d.veh}`;
            document.getElementById('u-type').innerText = `TYPE: ${type.toUpperCase()}`;
        };
        
        state.markers.set(d.veh, new maplibregl.Marker({element: el}).setLngLat([d.long, d.lat]).addTo(map));
        state.units.set(d.veh, { id: d.veh, lastSpd: d.spd, lastTs: Date.now() });
    }

    // Precise Physics Analysis
    const u = state.units.get(d.veh);
    const dt = (Date.now() - u.lastTs) / 1000;
    const g = Math.abs(d.spd - u.lastSpd) / (dt * 9.81 || 9.81);
    u.lastSpd = d.spd; u.lastTs = Date.now();

    // Movement (Linear)
    state.markers.get(d.veh).setLngLat([d.long, d.lat]);

    // Focused Analysis (Only for Selected)
    if (state.selected === d.veh) {
        state.gBuf.push(g); state.gBuf.shift();
        runAnalysis(d, g);
        sync(u, d, g);
    }
});

function runAnalysis(d, g) {
    document.getElementById('u-line').innerText = d.desi || "N/A";
    document.getElementById('u-spd').innerText = `VELOCITY: ${(d.spd * 3.6).toFixed(1)} KM/H`;
    
    // Schedule Guard
    const dl = d.dl || 0;
    const dlEl = document.getElementById('u-delay');
    dlEl.innerText = `DELAY: ${dl}S`;
    dlEl.style.color = dl > 60 ? "var(--danger)" : "var(--neon)";
    
    document.getElementById('u-stop').innerText = `STOP: ${d.stop || 'EN_ROUTE'}`;

    // Driver Conduct Monitor
    const warn = document.getElementById('driver-status');
    if (g > 0.28) {
        warn.innerHTML = `<span class="blink">⚠ AGGRESSIVE CONDUCT DETECTED (G:${g.toFixed(2)})</span>`;
    } else {
        warn.innerText = "CONDUCT: NOMINAL";
        warn.style.color = "#222";
    }

    if (state.chart) {
        state.chart.data.datasets[0].data = state.gBuf;
        state.chart.update('none');
    }
}

function sync(u, d, g) {
    if (g > 0.12 || Date.now() - (u.lW || 0) > 4000) {
        u.lW = Date.now();
        const packet = { t: Date.now(), g: g.toFixed(4), dl: d.dl, stop: d.stop, line: d.desi };
        db.ref(`live/${d.veh}`).set(packet);
        db.ref(`history/${d.veh}`).push(packet);
        
        const log = document.getElementById('log-stream');
        log.innerHTML = `<div class="log-line">[${new Date().toLocaleTimeString()}] <b>SYNC</b> -> ${d.veh} | DL:${d.dl} | G:${g.toFixed(2)}</div>` + log.innerHTML;
        if (log.children.length > 20) log.lastChild.remove();
    }
}

function initChart() {
    const ctx = document.getElementById('kineticChart').getContext('2d');
    state.chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array(60).fill(''),
            datasets: [{
                data: [], borderColor: '#bc13fe', borderWidth: 2, pointRadius: 0, fill: true,
                backgroundColor: 'rgba(188, 19, 254, 0.05)', tension: 0.4
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            scales: { y: { min: 0, max: 0.5, grid: {color: '#111'} }, x: { display: false } },
            plugins: { legend: { display: false } }
        }
    });
}

// Memory Cleanup
setInterval(() => {
    const now = Date.now();
    state.units.forEach((u, id) => {
        if (now - u.lastTs > 60000) {
            state.markers.get(id).remove();
            state.markers.delete(id);
            state.units.delete(id);
        }
    });
}, 30000);
</script>
</body>
</html>
