<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>JUDGE_OS_v31_QUANTUM</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon: #00f0ff; --ai: #bc13fe; --danger: #ff003c; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Consolas', monospace; overflow: hidden; }
        
        /* Kartta-alue optimoidulla renderöinnillä */
        #map { position: absolute; top: 0; bottom: 380px; width: 100%; contain: strict; }
        
        #dashboard { 
            position: absolute; bottom: 0; width: 100%; height: 380px; background: #050505;
            display: grid; grid-template-columns: 400px 1fr 400px; border-top: 2px solid var(--ai);
            z-index: 100;
        }

        .module { padding: 20px; border-right: 1px solid #111; position: relative; }
        .m-tag { font-size: 10px; color: #444; letter-spacing: 2px; margin-bottom: 10px; }
        
        /* Tarkkuuskortit */
        .p-card { background: rgba(255,255,255,0.02); border: 1px solid #111; padding: 15px; margin-bottom: 10px; }
        .p-val { font-size: 28px; font-weight: bold; color: var(--neon); }
        .alert { color: var(--danger); font-weight: bold; animation: pulse 0.4s infinite; }
        @keyframes pulse { 50% { opacity: 0.3; } }

        /* Markerit (Minimalistiset lagin vähentämiseksi) */
        .m-ptr { width: 10px; height: 10px; border: 1px solid #fff; border-radius: 50%; will-change: transform; pointer-events: auto; cursor: pointer; }
        .m-bus { background: var(--neon); }
    </style>
</head>
<body>

<div id="map"></div>

<div id="dashboard">
    <div class="module">
        <div class="m-tag">AI_PRECISION_ANALYSIS</div>
        <div class="p-card">
            <div id="u-line" class="p-val">---</div>
            <div id="u-delay" style="font-size: 18px; font-weight: bold;">DELAY: 0s</div>
        </div>
        <div class="p-card">
            <div style="font-size: 10px; color: #444;">STOP_PRECISION</div>
            <div id="u-stop" style="font-size: 12px; color: var(--ai);">AWAITING_DATA</div>
        </div>
    </div>

    <div class="module">
        <div class="m-tag">DRIVER_CONDUCT_G_FORCE</div>
        <canvas id="gChart"></canvas>
        <div id="driver-warning" style="margin-top: 10px; text-align: center;"></div>
    </div>

    <div class="module">
        <div class="m-tag">SENTINEL_CLOUD_FEED</div>
        <div id="log" style="font-size: 9px; color: #333; height: 260px; overflow: hidden;"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsCBiakmw92y60t4Z5PETtyuToY4EOnTA",
    authDomain: "developme-1a747.firebaseapp.com",
    databaseURL: "https://developme-1a747-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "developme-1a747",
    appId: "1:467417750458:web:f1ae85b3f27dc85114db83"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const state = { units: new Map(), markers: new Map(), selected: null, chart: null, gBuf: Array(40).fill(0) };

// KARTTA-MOOTTORIN OPTIMOINTI
const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [24.94, 60.17], zoom: 12,
    pitch: 0, bearing: 0,
    trackResize: false, // Vähentää laskentaa
    fadeDuration: 0    // Estää hitaan renderöinnin
});

const client = mqtt.connect('wss://mqtt.hsl.fi:443/');
client.on('connect', () => client.subscribe('/hfp/v2/journey/ongoing/vp/bus/#'));

// DATAN KÄSITTELYN RAJOITIN (Throttling)
let lastProcess = 0;
client.on('message', (t, m) => {
    const d = JSON.parse(m).VP;
    if (!d?.veh) return;

    if (!state.units.has(d.veh)) {
        const el = document.createElement('div');
        el.className = 'm-ptr m-bus';
        el.onclick = () => { state.selected = d.veh; if(!state.chart) initChart(); };
        state.markers.set(d.veh, new maplibregl.Marker({element: el}).setLngLat([d.long, d.lat]).addTo(map));
        state.units.set(d.veh, { id: d.veh, lastSpd: d.spd, lastTs: Date.now() });
    }

    const u = state.units.get(d.veh);
    const g = Math.abs(d.spd - u.lastSpd) / (((Date.now() - u.lastTs)/1000) * 9.81 || 9.81);
    u.lastSpd = d.spd; u.lastTs = Date.now();

    // Päivitetään sijainti aina, mutta analyysi vain valitulle (säästää CPU:ta)
    state.markers.get(d.veh).setLngLat([d.long, d.lat]);

    if (state.selected === d.veh) {
        state.gBuf.push(g); state.gBuf.shift();
        updateAnalysis(d, g);
        sync(u, d, g);
    }
});

function updateAnalysis(d, g) {
    document.getElementById('u-line').innerText = d.desi || "---";
    const delay = d.dl || 0;
    const delEl = document.getElementById('u-delay');
    delEl.innerText = "DELAY: " + delay + "s";
    delEl.style.color = delay > 60 ? "var(--danger)" : "var(--neon)";
    
    document.getElementById('u-stop').innerText = "AT_STOP: " + (d.stop || "EN_ROUTE");

    const warn = document.getElementById('driver-warning');
    if (g > 0.3) {
        warn.innerHTML = `<span class="alert">⚠ AGGRESSIVE DRIVING DETECTED</span>`;
    } else {
        warn.innerText = "DRIVER_CONDUCT: NOMINAL";
        warn.style.color = "#444";
    }

    if (state.chart) {
        state.chart.data.datasets[0].data = state.gBuf;
        state.chart.update('none');
    }
}

function sync(u, d, g) {
    if (g > 0.15 || Date.now() - (u.lW || 0) > 4000) {
        u.lW = Date.now();
        const p = { t: Date.now(), g: g.toFixed(4), dl: d.dl, stop: d.stop };
        db.ref(`live/${d.veh}`).set(p);
        const l = document.getElementById('log');
        l.innerHTML = `<div>[${new Date().toLocaleTimeString()}] AI_WATCH: ${d.veh} | DL:${d.dl}s</div>` + l.innerHTML;
        if (l.children.length > 15) l.lastChild.remove();
    }
}

function initChart() {
    state.chart = new Chart(document.getElementById('gChart'), {
        type: 'line',
        data: { labels: Array(40).fill(''), datasets: [{ data: [], borderColor: '#bc13fe', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: 'rgba(188,19,254,0.05)', tension: 0.4 }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { y: { min: 0, max: 0.5 }, x: { display: false } }, plugins: { legend: { display: false } } }
    });
}
</script>
</body>
</html>
