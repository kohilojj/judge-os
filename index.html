<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>JUDGE_OS_v29_PRECISION</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon: #00f0ff; --ai: #bc13fe; --danger: #ff003c; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Consolas', monospace; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 380px; width: 100%; }
        #os-core { 
            position: absolute; bottom: 0; width: 100%; height: 380px; background: #050505;
            display: grid; grid-template-columns: 380px 1fr 400px; border-top: 2px solid var(--ai);
        }
        .module { padding: 25px; border-right: 1px solid #111; position: relative; }
        .m-title { font-size: 10px; color: #444; letter-spacing: 2px; margin-bottom: 15px; }
        
        /* Analysis Cards */
        .a-card { background: rgba(255,255,255,0.02); border: 1px solid #1a1a1a; padding: 15px; border-radius: 4px; margin-bottom: 10px; }
        .val { font-size: 32px; font-weight: bold; color: var(--neon); }
        .alert { color: var(--danger); font-weight: bold; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        /* Marker Styling */
        .m-ptr { width: 14px; height: 14px; border: 2px solid #fff; transition: transform 0.8s linear; }
        .m-bus { background: var(--neon); border-radius: 50%; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="os-core">
    <div class="module">
        <div class="m-title">AI_PRECISION_ANALYSIS</div>
        <div class="a-card">
            <div id="u-id" style="font-size: 14px; color: #666;">SELECT_UNIT</div>
            <div id="u-line" class="val">---</div>
            <div id="u-status" style="font-size: 12px; margin-top: 5px;">STATUS: IDLE</div>
        </div>
        <div class="a-card">
            <div style="font-size: 10px; color: #444;">SCHEDULE_DEVIATION</div>
            <div id="u-delay" style="font-size: 20px; font-weight: bold;">0.0s</div>
            <div id="u-pysakki" style="font-size: 11px; color: #888;">STOP: ---</div>
        </div>
    </div>

    <div class="module">
        <div class="m-title">DRIVER_CONDUCT_G_SENSOR</div>
        <canvas id="gChart"></canvas>
        <div id="g-alert" style="margin-top: 10px; font-size: 11px;"></div>
    </div>

    <div class="module">
        <div class="m-title">SENTINEL_LOG_STREAM</div>
        <div id="log" style="font-size: 10px; color: #333; height: 260px; overflow: hidden;"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsCBiakmw92y60t4Z5PETtyuToY4EOnTA",
    authDomain: "developme-1a747.firebaseapp.com",
    databaseURL: "https://developme-1a747-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "developme-1a747",
    appId: "1:467417750458:web:f1ae85b3f27dc85114db83"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const state = { units: new Map(), markers: new Map(), selected: null, chart: null, gBuf: Array(50).fill(0) };

const map = new maplibregl.Map({
    container: 'map', style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [24.94, 60.17], zoom: 13, pitch: 0
});

const client = mqtt.connect('wss://mqtt.hsl.fi:443/');
client.on('connect', () => client.subscribe('/hfp/v2/journey/ongoing/vp/bus/#'));

client.on('message', (t, m) => {
    const d = JSON.parse(m).VP;
    if (!d?.veh) return;

    if (!state.units.has(d.veh)) {
        const el = document.createElement('div');
        el.className = 'm-ptr m-bus';
        el.onclick = () => { state.selected = d.veh; if(!state.chart) initChart(); };
        state.markers.set(d.veh, new maplibregl.Marker({element: el}).setLngLat([d.long, d.lat]).addTo(map));
        state.units.set(d.veh, { id: d.veh, lastSpd: d.spd, lastTs: Date.now() });
    }

    const u = state.units.get(d.veh);
    const g = Math.abs(d.spd - u.lastSpd) / (((Date.now() - u.lastTs)/1000) * 9.81 || 9.81);
    u.lastSpd = d.spd; u.lastTs = Date.now();
    state.markers.get(d.veh).setLngLat([d.long, d.lat]);

    if (state.selected === d.veh) {
        state.gBuf.push(g); state.gBuf.shift();
        updateUI(d, g);
        sync(u, d, g);
    }
});

function updateUI(d, g) {
    document.getElementById('u-id').innerText = "VEHICLE_ID: " + d.veh;
    document.getElementById('u-line').innerText = d.desi || "---";
    
    // AI MYÖHÄSTYMIS-ANALYYSI
    const delay = d.dl || 0;
    const delayEl = document.getElementById('u-delay');
    delayEl.innerText = (delay > 0 ? "+" : "") + delay + "s";
    delayEl.style.color = delay > 60 ? "var(--danger)" : "var(--neon)";
    
    document.getElementById('u-status').innerText = delay > 60 ? "STATUS: BEHIND SCHEDULE" : "STATUS: ON TIME";
    document.getElementById('u-pysakki').innerText = "NEXT_STOP: " + (d.stop || "EN_ROUTE");

    // KULJETTAJAN AJOTAPA-ANALYYSI
    const alertEl = document.getElementById('g-alert');
    if (g > 0.25) {
        alertEl.innerHTML = `<span class="alert">⚠ AGGRESSIVE DRIVER CONDUCT DETECTED (G:${g.toFixed(2)})</span>`;
    } else {
        alertEl.innerText = "DRIVER_CONDUCT: NOMINAL";
        alertEl.style.color = "#444";
    }

    if (state.chart) {
        state.chart.data.datasets[0].data = state.gBuf;
        state.chart.update('none');
    }
}

function sync(u, d, g) {
    if (g > 0.12 || Date.now() - (u.lW || 0) > 3000) {
        u.lW = Date.now();
        const p = { t: Date.now(), g: g.toFixed(4), delay: d.dl, line: d.desi };
        db.ref(`live/${d.veh}`).set(p);
        db.ref(`history/${d.veh}`).push(p);
        
        const log = document.getElementById('log');
        log.innerHTML = `<div>[${new Date().toLocaleTimeString()}] AI_WATCH: ${d.veh} | DL:${d.dl}s | G:${g.toFixed(2)}</div>` + log.innerHTML;
        if (log.children.length > 20) log.lastChild.remove();
    }
}

function initChart() {
    state.chart = new Chart(document.getElementById('gChart'), {
        type: 'line',
        data: {
            labels: Array(50).fill(''),
            datasets: [{ data: [], borderColor: '#bc13fe', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: 'rgba(188,19,254,0.05)', tension: 0.4 }]
        },
        options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { y: { min: 0, max: 0.5, grid: {color:'#111'} }, x: { display: false } }, plugins: { legend: { display: false } } }
    });
}
</script>
</body>
</html>
