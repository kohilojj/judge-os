<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JUDGE_DASH_v43_CHAOS</title>
    <style>
        :root {
            --neon: #00f0ff;
            --ai: #bc13fe;
            --danger: #ff003c;
            --bg: #020205;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            font-family: 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; color: white;
        }

        #game-window {
            position: relative;
            width: 100vw; height: 100vh;
            max-width: 900px; max-height: 500px;
            background: #000;
            border: 2px solid var(--ai);
            overflow: hidden;
        }

        /* DYNAAMINEN TAUSTA */
        .bg-grid {
            position: absolute; width: 200%; height: 100%;
            background-image: 
                linear-gradient(rgba(188, 19, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(188, 19, 254, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        #player {
            position: absolute; width: 40px; height: 40px;
            background: var(--neon);
            border: 3px solid #fff;
            box-shadow: 0 0 20px var(--neon);
            bottom: 60px; left: 80px;
            z-index: 10;
        }

        /* ESTETYIPIT */
        .obstacle { position: absolute; bottom: 60px; z-index: 8; }
        
        /* Piikki */
        .spike {
            width: 40px; height: 40px;
            background: var(--danger);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* Tuplapiikki */
        .double-spike {
            width: 80px; height: 40px;
            background: var(--danger);
            clip-path: polygon(25% 0%, 0% 100%, 50% 100%, 75% 0%, 50% 100%, 100% 100%);
        }

        /* Korkea muuri */
        .wall {
            width: 30px; height: 60px;
            background: #ffaa00;
            border: 2px solid #fff;
            box-shadow: 0 0 15px #ffaa00;
        }

        #floor {
            position: absolute; bottom: 0; width: 100%; height: 60px;
            background: #080808; border-top: 3px solid var(--ai);
        }

        #hud {
            position: absolute; top: 20px; left: 20px;
            font-size: 20px; font-weight: bold; color: var(--neon); z-index: 20;
        }

        #death-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
        }

        button {
            background: var(--ai); color: white; border: none; padding: 15px 40px;
            font-size: 20px; cursor: pointer; border-radius: 5px; margin-top: 20px;
        }
    </style>
</head>
<body onmousedown="jump()" ontouchstart="jump()">

    <div id="game-window">
        <div class="bg-grid" id="grid"></div>
        <div id="hud">SCORE: <span id="score-val">0</span> | SPEED: <span id="speed-val">1.0</span></div>
        <div id="player"></div>
        <div id="floor"></div>

        <div id="death-screen">
            <h1 style="color:var(--danger); font-size: 40px;">CRITICAL_FAILURE</h1>
            <button onclick="location.reload()">REBOOT SYSTEM</button>
        </div>
    </div>

<script>
    const player = document.getElementById('player');
    const scoreVal = document.getElementById('score-val');
    const speedVal = document.getElementById('speed-val');
    const deathScreen = document.getElementById('death-screen');
    const grid = document.getElementById('grid');

    let gameActive = true;
    let score = 0;
    let py = 60;
    let velocity = 0;
    const gravity = 0.7;
    const jumpPower = 14;
    
    let baseSpeed = 6;
    let currentSpeed = 6;
    let obstacles = [];
    let gridPos = 0;

    window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });

    function jump() {
        if (py === 60 && gameActive) velocity = jumpPower;
    }

    function spawnObstacle() {
        if (!gameActive) return;

        const obs = document.createElement('div');
        obs.className = 'obstacle';
        
        // ARVOTAAN ESTETYYPPI
        const type = Math.random();
        if (type < 0.5) {
            obs.classList.add('spike'); // Tavallinen piikki
        } else if (type < 0.8) {
            obs.classList.add('double-spike'); // Leveä tuplapiikki
        } else {
            obs.classList.add('wall'); // Korkea este
        }

        obs.style.left = '1000px';
        document.getElementById('game-window').appendChild(obs);
        obstacles.push(obs);

        // VAIHTELEVA RYTMI: Seuraava este tulee 0.7s - 2.5s päästä
        let nextSpawn = Math.random() * 1800 + 700;
        setTimeout(spawnObstacle, nextSpawn);
    }

    function update() {
        if (!gameActive) return;

        // Fysiikka
        velocity -= gravity;
        py += velocity;
        if (py <= 60) { py = 60; velocity = 0; }
        player.style.bottom = py + 'px';
        player.style.transform = py > 60 ? `rotate(${score * 10}deg)` : 'rotate(0deg)';

        // Taustan liike
        gridPos -= currentSpeed / 2;
        grid.style.transform = `translateX(${gridPos % 50}px)`;

        // Nopeutetaan peliä hitaasti pisteiden mukaan
        currentSpeed = baseSpeed + (score * 0.15);
        speedVal.innerText = (currentSpeed / 6).toFixed(1) + "x";

        // Esteiden käsittely
        obstacles.forEach((obs, index) => {
            let ox = parseInt(obs.style.left);
            ox -= currentSpeed;
            obs.style.left = ox + 'px';

            // Hitbox tarkistus
            const pRect = player.getBoundingClientRect();
            const oRect = obs.getBoundingClientRect();

            if (
                pRect.right - 8 > oRect.left &&
                pRect.left + 8 < oRect.right &&
                pRect.bottom - 5 > oRect.top
            ) {
                gameActive = false;
                deathScreen.style.display = 'flex';
            }

            if (ox < -100) {
                obs.remove();
                obstacles.splice(index, 1);
                score++;
                scoreVal.innerText = score;
            }
        });

        requestAnimationFrame(update);
    }

    spawnObstacle();
    update();
</script>
</body>
</html>
